#
# hyprlock.conf — your swaylock call was just `swaylock -f -c 000000`
# (solid black). This keeps it simple but adds a clock + blurred screenshot
# background, matching the "subtle polish" look of the rest of the setup.
#

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 250, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(89b4faee)
    inner_color = rgba(30302eaa)
    font_color = rgba(cdd6f4ee)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME12
    font_size = 90
    font_family = Cascadia Code NF
    color = rgba(cdd6f4ee)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    font_size = 20
    font_family = Cascadia Code NF
    color = rgba(bac2deee)
    position = 0, 80
    halign = center
    valign = center
}

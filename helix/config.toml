theme = "rose_pine"
[editor]
line-number = "relative"
auto-completion = false
continue-comments = false
auto-format = true
auto-info = true
path-completion = true
end-of-line-diagnostics = "hint"

[editor.soft-wrap]
enable = true
max-wrap = 25
max-indent-retain = 0
wrap-indicator = ""
wrap-at-text-width = false


[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-inlay-hints = true
auto-signature-help = false

[keys.insert]
C-k = "signature_help"

[keys.normal]
F5 = [":write", ":sh hxrun \"%{buffer_name}\""]


# fuzzel is compositor-agnostic too — no changes needed for Hyprland.
# Also used by scripts/exit-hyprland.sh as a dmenu-style confirm prompt.

[main]
font=JetBrainsMono Nerd Font:size=10
terminal=alacritty
lines=10
layer=overlay
width=40
horizontal-pad=20
vertical-pad=10
inner-pad=5

[colors]
background=1e1e2eee
text=cdd6f4ff
match=89b4faff
selection=45475aff
selection-text=cdd6f4ff
border=89b4faff

[border]
width=2
radius=10

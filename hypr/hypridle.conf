#
# hypridle.conf — mirrors your swayidle setup:
#   600s  -> lock, unless media is playing
#   1200s -> screen off, unless media is playing (screen back on on resume)
#   before sleep -> lock
#

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = playerctl status 2>/dev/null | grep -q Playing || loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = playerctl status 2>/dev/null | grep -q Playing || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

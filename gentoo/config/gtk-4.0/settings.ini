[Settings]
# GTK 4 reads this file. libadwaita programs ignore the theme name. They
# use the color-scheme from gsettings (hypr/scripts/dark-theme.sh).
# There is no "gtk-application-prefer-dark-theme" line here on purpose:
# libadwaita writes a warning for each program when it is set. GTK 4.20
# and later get the dark mode from color-scheme.
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=phinger-cursors-dark
gtk-cursor-theme-size=40

# fuzzel is compositor-agnostic too — no changes needed for Hyprland.
# Also used by scripts/exit-hyprland.sh as a dmenu-style confirm prompt.

[main]
font=JetBrainsMono Nerd Font:size=10
terminal=alacritty
lines=10
layer=overlay
width=40
horizontal-pad=20
vertical-pad=10
inner-pad=5

# Gruvbox Dark. Format is RRGGBBAA.
[colors]
background=282828ee
text=ebdbb2ff
match=fabd2fff
selection=504945ff
selection-text=fbf1c7ff
border=fabd2fff

[border]
width=2
radius=10

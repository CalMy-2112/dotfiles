#
# hyprlock.conf for Gentoo (omen), night-train colors.
# The background is the wallpaper, with blur and less brightness.
# install.sh links ~/.config/hypr/wallpapers/hyprland-girl.jpg to the
# repository copy (wallpapers/hyprland-girl.jpg).
#

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/hyprland-girl.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.2
    # Used if the image is not there.
    color = rgb(140b33)
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    # Ring: cyan to lavender. Glow cyan while it checks. Red on a wrong
    # password. Orange when Caps Lock is on.
    outer_color = rgba(47aedaee) rgba(ba94c3ee) 45deg
    inner_color = rgba(140b33cc)
    font_color = rgb(e4e0f7)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(7fd8f2ee) rgba(47aedaee) 45deg
    fail_color = rgba(f0647fee)
    capslock_color = rgba(f2a272ee)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = rgba(0b0620ee)
}

label {
    monitor =
    text = $TIME12
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgb(e4e0f7)
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = rgba(0b0620ee)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgb(ba94c3)
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = rgba(0b0620ee)
}

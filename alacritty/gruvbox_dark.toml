# Gruvbox Dark (medium contrast), from morhetz/gruvbox-contrib
# (xresources/gruvbox-dark.xresources).
# For hard contrast set background to '#1d2021', for soft to '#32302f'.

[colors.primary]
background = '#282828'
foreground = '#ebdbb2'

[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

[colors.selection]
text       = 'CellForeground'
background = '#504945'

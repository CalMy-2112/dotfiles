[Settings]
# GTK 3 reads this file. On Wayland, the gsettings values from
# hypr/scripts/dark-theme.sh replace the theme, icon and cursor values.
# Programs that run in XWayland use this file.
# If adw-gtk3-dark is not installed, GTK 3 uses Adwaita. The "prefer dark"
# line then makes it dark.
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=phinger-cursors-dark
gtk-cursor-theme-size=40
gtk-application-prefer-dark-theme=1

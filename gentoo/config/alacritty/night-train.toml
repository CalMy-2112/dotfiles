# night-train: colors from wallpapers/hyprland-girl.jpg (Gentoo theme).
# yazi, btop, fastfetch and the shell use these 16 colors too.

[colors.primary]
background = '#140b33'
foreground = '#e4e0f7'
dim_foreground = '#aaa6d6'
bright_foreground = '#ffffff'

[colors.cursor]
text = '#140b33'
cursor = '#7fd8f2'

[colors.vi_mode_cursor]
text = '#140b33'
cursor = '#ba94c3'

[colors.selection]
text = 'CellForeground'
background = '#2b3786'

[colors.search.matches]
foreground = '#140b33'
background = '#ba94c3'

[colors.search.focused_match]
foreground = '#140b33'
background = '#47aeda'

[colors.hints.start]

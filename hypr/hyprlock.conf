#
# hyprlock.conf — your swaylock call was just `swaylock -f -c 000000`
# (solid black). This keeps it simple but adds a clock + blurred screenshot
# background, matching the "subtle polish" look of the rest of the setup.
#

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    color = rgb(282828)
}

input-field {
    monitor =
    size = 250, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    # Gruvbox Dark: yellow ring, green while checking, red on a wrong password
    outer_color = rgba(fabd2fee)
    inner_color = rgba(3c3836aa)
    font_color = rgba(ebdbb2ee)
    check_color = rgba(b8bb26ee)
    fail_color = rgba(fb4934ee)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME12
    font_size = 90
    font_family = JetBrains Mono Nerd Font
    color = rgba(ebdbb2ee)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    color = rgba(d5c4a1ee)
    position = 0, 80
    halign = center
    valign = center
}

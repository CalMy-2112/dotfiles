# fuzzel is compositor-agnostic too — no changes needed for Hyprland.
# Also used by scripts/exit-hyprland.sh as a dmenu-style confirm prompt.

[main]
font=Cascadia Code NF:size=12
terminal=ghostty
layer=overlay
width=40
horizontal-pad=16
vertical-pad=10
inner-pad=8

[colors]
background=1e1e2eee
text=cdd6f4ff
match=89b4faff
selection=45475aff
selection-text=cdd6f4ff
border=89b4faff

[border]
width=2
radius=10

[general]
import = ["~/.config/alacritty/gruvbox_dark.toml"]

[window]
dimensions = { columns = 204, lines = 54 }
decorations = "None"
padding = { x = 8, y = 8 }
opacity = 0.85
blur = true

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 12
[keyboard]
bindings = [
  { key = "S", mods = "Command", chars = "\u0001sa" },
]

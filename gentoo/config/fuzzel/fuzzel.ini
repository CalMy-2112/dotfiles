# fuzzel.ini for Gentoo (omen), night-train colors.
# Also used by hypr/scripts/exit-hyprland.sh as a dmenu-style confirm prompt.

[main]
font=JetBrainsMono Nerd Font:size=10
terminal=alacritty
icon-theme=Papirus-Dark
lines=8
layer=overlay
width=40
horizontal-pad=20
vertical-pad=10
inner-pad=5

# Format is RRGGBBAA. The background is a little transparent. Hyprland
# blurs what is behind it (layer rule "blur_fuzzel" in hyprland.lua).
[colors]
background=140b33dd
text=e4e0f7ff
prompt=ba94c3ff
placeholder=6f6aa8ff
input=e4e0f7ff
match=47aedaff
selection=2b3786ff
selection-text=ffffffff
selection-match=7fd8f2ff
counter=6f6aa8ff
border=47aedaff

[border]
width=2
radius=10

# ~/.config/gtk-4.0/settings.ini (symlink to gtk/gtk-4.0/settings.ini in the
# dots repo). Dark for plain GTK4 apps. libadwaita apps (Nautilus, Settings)
# ignore this file and use the GNOME color-scheme setting instead, which
# xmonad/autostart.sh sets.
[Settings]
gtk-application-prefer-dark-theme=true

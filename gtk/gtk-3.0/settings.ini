# ~/.config/gtk-3.0/settings.ini (symlink to gtk/gtk-3.0/settings.ini in the
# dots repo). Dark Adwaita for GTK3 apps: the nm-applet and blueman menus
# (drawn by snixembed), pasystray, Firefox's own widgets.
# Under xmonad no settings daemon runs, so GTK reads this file.
# Adwaita with the dark variant is Adwaita-dark; it is built into GTK3,
# so nothing extra needs to be installed (Ubuntu or FreeBSD).
# Apps that are already running keep the old look until they restart.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=true

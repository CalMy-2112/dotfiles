#
# hyprland.conf — ported from your sway config
# Written for Hyprland 0.55.x (ashbuk/Hyprland-Fedora COPR). If you land on a
# much newer/older version and get "invalid rule" errors on start, it's almost
# always the windowrule block below — see the note there.
#
env = QT_QPA_PLATFORMTHEME,qt6ct
exec-once = dbus-update-activation-environment --systemd --all

################
### VARIABLES ##
################
$mainMod = SUPER
$terminal = alacritty
$menu = fuzzel

#############
### MONITOR #
#############
# Mirrors `output * scale 1.35` from sway — applies to every connected output.
# Pin a specific one later with e.g. monitor = eDP-1,1920x1200@60,0x0,1.35
monitor = ,preferred,auto,1.33

###############
### ENV VARS ##
###############
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

#################
### AUTOSTART ###
#################
# Replaces the systemctl set-environment/import-environment/start
# graphical-session.target lines from sway — this is Hyprland's equivalent
# for making sure DBus/systemd activation env vars (needed by portals,
# waybar's systemd integration, etc.) are correct.
exec-once = dbus-update-activation-environment --systemd --all
exec-once = gentoo-pipewire-launcher
exec-once = waybar
exec-once = mako
exec-once = udiskie --notify
exec-once = /usr/bin/lxqt-policykit-agent
exec-once = hyprpaper
#exec-once = hypridle
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"

#############
### INPUT ###
#############
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}


#############
### LOOK ####
#############
# "Subtle polish": light blur, quick animations, small gaps — a step up from
# sway's flat look without turning into a rice.
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aee)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 6

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 3, easeOutQuint, popin 90%
    animation = windowsOut, 1, 3, easeOutQuint, popin 90%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, easeOutQuint, slide
}

# dwindle = binary-tree auto split, closest thing to sway's default splith
# behavior. No manual layout picking needed — this is what you want given
# you said you don't need complex tiling.
dwindle {
    preserve_split = true
    smart_split = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

#############################
### WINDOW / LAYER RULES ####
#############################
# 0.53+ syntax (windowrulev2 is dead — everything lives under `windowrule` now
# with match: selectors). These weren't in your sway config; they're small
# quality-of-life additions. Delete if you'd rather start from nothing.
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$

################
### KEYBINDS ###
################

# --- apps / session, mirrors your top block ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/exit-hyprland.sh

# floating_modifier $mod normal -> hold mod + drag with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- focus movement: vim keys + arrows, both bound like your sway config ---
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# --- move window in a direction ---
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# --- workspaces 1-10 ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# movetoworkspacesilent = moves the window but keeps YOU on the current
# workspace, matching sway's "move container to workspace" behavior exactly
# (sway doesn't follow the window; plain movetoworkspace in Hyprland would).
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# --- layout ---
# togglesplit is dwindle's equivalent of sway's "layout toggle split"
bind = $mainMod, e, layoutmsg, togglesplit
bind = $mainMod, f, fullscreen, 0
bind = $mainMod SHIFT, space, togglefloating,

# NOTE: sway's `focus mode_toggle` (swap focus between the floating and
# tiling layers) and `focus parent` (walk up the container tree) don't have
# a clean 1:1 Hyprland dispatcher — dwindle doesn't expose container parents
# the way i3/sway's tree does. Left unbound rather than faking it.

# Optional bonus: Hyprland "groups" are the closest thing to sway's
# stacking/tabbed containers, not in your original config but handy to have.
bind = $mainMod, w, togglegroup,
bind = $mainMod, Tab, changegroupactive, f

# --- scratchpad -> Hyprland's "special" workspace ---
bind = $mainMod SHIFT, minus, movetoworkspacesilent, special
bind = $mainMod, minus, togglespecialworkspace,

# --- resize mode (submap), same feel as sway's mode "resize" ---
bind = $mainMod, r, submap, resize
submap = resize
binde = , h, resizeactive, -10 0
binde = , l, resizeactive, 10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
binde = , Left, resizeactive, -10 0
binde = , Right, resizeactive, 10 0
binde = , Up, resizeactive, 0 -10
binde = , Down, resizeactive, 0 10
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# --- media keys ---
# Named XF86 keys instead of your raw bindcode 121/122/123 — try these first;
# if your laptop's keyboard doesn't emit them (why you likely used bindcode
# originally), run `wev` to find the real keycodes and swap `bindel = ,XF86...`
# for `bindel = ,code:NNN,...`.
# bindel = repeats while held AND still works when the session is locked.
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-

# bindl = works when locked, no repeat — matches your --locked flags
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioStop, exec, playerctl stop

# --- screenshots: grim/slurp/swappy work unmodified under Hyprland ---
$screenshot_dir = ~/Pictures/Screenshots
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, mkdir -p $screenshot_dir && grim $screenshot_dir/$(date +'%Y-%m-%d-%H%M%S').png
bind = $mainMod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, a, exec, grim -g "$(slurp)" - | swappy -f -

# Native Wayland rendering for Qt apps — fixes blur from XWayland scaling
env = QT_QPA_PLATFORM,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Native Wayland rendering for Electron apps (Bitwarden, etc.) — fixes blur from XWayland scaling
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

